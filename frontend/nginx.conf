# ============================================================
# frontend/nginx.conf
# Nginx server 块配置 (被 /etc/nginx/nginx.conf 通过
# include /etc/nginx/conf.d/*.conf 引入到 http 上下文)
# 职责:
#   1. 托管 Vue SPA 静态产物 (/usr/share/nginx/html)
#   2. SPA 路由回退: 任意未匹配路径回退到 index.html
#   3. 反向代理 /api/ -> app:8080/ (后端 Spring Boot)
#   4. 反向代理 /images/ -> app:8080/ (商品图片静态资源)
#   5. 开启 gzip 压缩, 减小传输体积
#   6. client_max_body_size 20m 支持商品图片上传
# 安全要点:
#   - proxy_pass 使用内部 docker 网络主机名 app:8080, 不经公网
#   - 转发 X-Real-IP / X-Forwarded-For / X-Forwarded-Proto 供后端日志与信任代理处理
#   - server_tokens off 隐藏 Nginx 版本号
# ============================================================

server {
    listen       80;
    server_name  _;

    # 隐藏 Nginx 版本号 (避免暴露已知漏洞版本)
    server_tokens off;

    # 前端静态产物根目录
    root   /usr/share/nginx/html;
    index  index.html;

    # 支持商品图片上传 (后端限制 + Nginx 限制双重防护)
    client_max_body_size 20m;

    # ---------- gzip 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2
        application/font-woff
        application/vnd.ms-fontobject;

    # ---------- SPA 路由回退 ----------
    # Vue Router history 模式: 任意未匹配静态文件的路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 反向代理: API 接口 ----------
    # /api/xxx -> app:8080/xxx
    # 注意 proxy_pass 末尾带 /, Nginx 会替换 location 匹配的 /api/ 前缀为 /
    # 例: /api/user/login -> http://app:8080/user/login
    location /api/ {
        proxy_pass http://app:8080/;
        proxy_http_version 1.1;

        # WebSocket 支持 (为后续秒杀结果推送预留)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 转发原始请求信息, 供后端正确识别客户端
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # 超时设置 (秒杀等长耗时接口需要较长超时)
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 缓冲设置 (大响应不缓冲到磁盘, 直接流式返回)
        proxy_buffering off;
    }

    # ---------- 反向代理: 商品图片静态资源 ----------
    # /images/xxx -> app:8080/images/xxx
    # 注意此处 proxy_pass 末尾不带 /, Nginx 保留原始路径
    # 例: /images/product/1001.jpg -> http://app:8080/images/product/1001.jpg
    location /images/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 静态资源开启缓冲, 提升传输效率
        proxy_buffering on;
        proxy_cache_valid 200 1h;
    }

    # ---------- 反向代理: 上传文件路径 ----------
    # /upload/xxx -> app:8080/upload/xxx (与 /images/ 同样保留路径)
    location /upload/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 静态资源缓存 ----------
    # Vite 构建产物 assets/ 下文件名带 hash, 可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- 健康检查端点 ----------
    # 直接返回 200, 不走后端 (供 docker healthcheck 使用)
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ---------- 错误页面 ----------
    # SPA 应用统一由 index.html 处理 404, 避免用户看到 Nginx 默认 404
    error_page 404 /index.html;
}