spring:
  datasource:
    url: jdbc:mysql://localhost:3307/seckill_mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 8
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        concurrency: 3
        retry:
          enabled: false
  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          ssl:
            enable: true
          auth: true
          starttls:
            enable: true

jwt:
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000

seckill:
  pay-timeout-minutes: 15
  rate-limit-per-user: 1
  rate-limit-per-ip: 30
  security:
    sign-secret: ${SECKILL_SIGN_SECRET}
    replay-window-seconds: 60

logging:
  level:
    com.seckill.mall: DEBUG
