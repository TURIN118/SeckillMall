# ============================================================
# 开发环境配置（H-K5 修复：去掉默认值、useSSL=true、characterEncoding=utf8mb4）
# ============================================================
# 开发环境保留默认值便于本地启动，但连接参数对齐生产（utf8mb4/SSL）。
# 生产环境使用 application-prod.yml，所有敏感配置强制外部注入。
# ============================================================

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/seckill_mall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:seckill_app}
    password: ${DB_PASSWORD:abc123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20

  # ---------- Redis ----------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: 8

  # ---------- RabbitMQ ----------
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # H-C5 修复（组B）：开发环境也开启 confirm/returns，与生产一致
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        concurrency: 3
        retry:
          enabled: false

  # ---------- 邮件 ----------
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          ssl:
            enable: true
          auth: true
          starttls:
            enable: true

# ---------- JWT ----------
jwt:
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000

# ---------- 秒杀配置 ----------
seckill:
  pay-timeout-minutes: 15
  rate-limit-per-user: 1
  rate-limit-per-ip: 30
  security:
    # B2 修复：开发环境签名密钥（生产通过 application-prod.yml 强制注入）
    sign-secret: ${SECKILL_SIGN_SECRET:dev-only-sign-secret-not-for-production-use-32chars}
    replay-window-seconds: 60
    # C2 修复：开发环境信任本地代理
    trusted-proxy-ips: ${TRUSTED_PROXY_IPS:127.0.0.1,::1}
    # M-K2 修复：CORS 开发环境允许的来源
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173}

# ---------- 日志 ----------
logging:
  level:
    com.seckill.mall: DEBUG
