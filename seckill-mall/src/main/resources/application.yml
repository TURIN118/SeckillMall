server:
  port: 8080
  tomcat:
    max-threads: 200
    accept-count: 100

spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB
  mail:
    host: smtp.example.com
    port: 587
    username: your-email@example.com
    password: your-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

jwt:
  rsa:
    private-key-path: ${JWT_RSA_PRIVATE_KEY_PATH:classpath:keys/private.pem}
    public-key-path: ${JWT_RSA_PUBLIC_KEY_PATH:classpath:keys/public.pem}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true

knife4j:
  enable: true
  setting:
    language: zh_cn

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
        exclude: env,beans
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
  info:
    env:
      enabled: true

info:
  app:
    name: 秒杀电商平台
    description: 高并发秒杀电商平台 Spring Boot 后端
    version: 1.0.0
    author: WNJ

upload:
  base-dir: ${user.dir}/images
  base-url: /images
  allowed-types: image/jpeg,image/png,image/gif,image/webp
  max-size: 5242880

# 文件存储配置
storage:
  type: local  # local | minio

# MinIO 对象存储配置（预留，启用 storage.type=minio 时需取消注释并填写连接信息）
# minio:
#   endpoint: http://localhost:9000
#   access-key: minioadmin
#   secret-key: minioadmin
#   bucket: seckill-mall
