<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>订单取消</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f6fa;font-family:'Microsoft YaHei','Helvetica Neue',Arial,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f5f6fa;padding:24px 0;">
    <tr>
        <td align="center">
            <table width="600" cellpadding="0" cellspacing="0" border="0"
                   style="background-color:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.05);">
                <!-- 顶部 Logo 区 -->
                <tr>
                    <td style="background:linear-gradient(135deg,#636e72,#b2bec3);padding:24px 32px;text-align:center;">
                        <span style="font-size:22px;font-weight:bold;color:#ffffff;letter-spacing:2px;"
                              th:text="${appName} + ' · 秒杀商城'">秒杀商城</span>
                    </td>
                </tr>
                <!-- 正文 -->
                <tr>
                    <td style="padding:32px;">
                        <h2 style="margin:0 0 16px;color:#2d3436;font-size:20px;">订单取消通知</h2>
                        <p style="margin:0 0 16px;color:#636e72;line-height:1.6;font-size:14px;">
                            您的订单已被取消，详情如下：
                        </p>
                        <table width="100%" cellpadding="0" cellspacing="0" border="0"
                               style="margin:0 0 16px;border:1px solid #dfe6e9;border-radius:6px;overflow:hidden;">
                            <tr>
                                <td style="padding:12px 16px;background-color:#f1f2f6;color:#636e72;font-size:13px;width:120px;">订单编号</td>
                                <td style="padding:12px 16px;color:#2d3436;font-size:14px;" th:text="${orderNo}">SK20260101000000</td>
                            </tr>
                            <tr>
                                <td style="padding:12px 16px;background-color:#f1f2f6;color:#636e72;font-size:13px;">取消原因</td>
                                <td style="padding:12px 16px;color:#d63031;font-size:14px;" th:text="${reason}">订单已取消</td>
                            </tr>
                        </table>
                        <p style="margin:0;color:#636e72;font-size:13px;line-height:1.6;">
                            如有疑问，请联系客服或前往订单中心查看详情。
                        </p>
                    </td>
                </tr>
                <!-- 底部版权 -->
                <tr>
                    <td style="padding:20px 32px;background-color:#f1f2f6;text-align:center;">
                        <p style="margin:0;color:#b2bec3;font-size:12px;">
                            © <span th:text="${T(java.time.Year).now().getValue()}">2026</span>
                            <span th:text="${appName}">seckill-mall</span> · 本邮件由系统自动发送，请勿直接回复
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
