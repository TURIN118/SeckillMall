<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>密码重置</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f6fa;font-family:'Microsoft YaHei','Helvetica Neue',Arial,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f5f6fa;padding:24px 0;">
    <tr>
        <td align="center">
            <table width="600" cellpadding="0" cellspacing="0" border="0"
                   style="background-color:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.05);">
                <!-- 顶部 Logo 区 -->
                <tr>
                    <td style="background:linear-gradient(135deg,#8e2de2,#4a00e0);padding:24px 32px;text-align:center;">
                        <span style="font-size:22px;font-weight:bold;color:#ffffff;letter-spacing:2px;"
                              th:text="${appName} + ' · 秒杀商城'">秒杀商城</span>
                    </td>
                </tr>
                <!-- 正文 -->
                <tr>
                    <td style="padding:32px;">
                        <h2 style="margin:0 0 16px;color:#2d3436;font-size:20px;">密码重置申请</h2>
                        <p style="margin:0 0 12px;color:#636e72;line-height:1.6;font-size:14px;">
                            您申请了密码重置，请使用以下重置 Token 完成身份验证：
                        </p>
                        <div style="margin:16px 0;padding:18px;background-color:#f1f2f6;border-radius:6px;text-align:center;word-break:break-all;">
                            <span style="font-size:18px;font-weight:bold;color:#4a00e0;letter-spacing:2px;"
                                  th:text="${resetToken}">RESET-TOKEN</span>
                        </div>
                        <div style="padding:14px 16px;background-color:#fff6e6;border-left:4px solid #ffa502;border-radius:4px;">
                            <p style="margin:0;color:#b8860b;font-size:13px;line-height:1.6;">
                                ⏰ 重置 Token 有效期为 <strong th:text="${validMinutes}">30</strong> 分钟，过期需重新申请。
                            </p>
                        </div>
                        <p style="margin:16px 0 0;color:#b2bec3;line-height:1.6;font-size:12px;">
                            如非本人操作，请忽略本邮件并检查账号安全。
                        </p>
                    </td>
                </tr>
                <!-- 底部版权 -->
                <tr>
                    <td style="padding:20px 32px;background-color:#f1f2f6;text-align:center;">
                        <p style="margin:0;color:#b2bec3;font-size:12px;">
                            © <span th:text="${T(java.time.Year).now().getValue()}">2026</span>
                            <span th:text="${appName}">seckill-mall</span> · 本邮件由系统自动发送，请勿直接回复
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
