<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>注册验证码</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f6fa;font-family:'Microsoft YaHei','Helvetica Neue',Arial,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f5f6fa;padding:24px 0;">
    <tr>
        <td align="center">
            <table width="600" cellpadding="0" cellspacing="0" border="0"
                   style="background-color:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.05);">
                <!-- 顶部 Logo 区 -->
                <tr>
                    <td style="background:linear-gradient(135deg,#ff4e50,#f9d423);padding:24px 32px;text-align:center;">
                        <span style="font-size:22px;font-weight:bold;color:#ffffff;letter-spacing:2px;"
                              th:text="${appName} + ' · 秒杀商城'">秒杀商城</span>
                    </td>
                </tr>
                <!-- 正文 -->
                <tr>
                    <td style="padding:32px;">
                        <h2 style="margin:0 0 16px;color:#2d3436;font-size:20px;">您好，欢迎注册！</h2>
                        <p style="margin:0 0 12px;color:#636e72;line-height:1.6;font-size:14px;">
                            您的注册验证码为：
                        </p>
                        <div style="margin:16px 0;padding:18px;background-color:#f1f2f6;border-radius:6px;text-align:center;">
                            <span style="font-size:30px;font-weight:bold;color:#ff4e50;letter-spacing:8px;"
                                  th:text="${verifyCode}">123456</span>
                        </div>
                        <p style="margin:0 0 8px;color:#636e72;line-height:1.6;font-size:14px;">
                            验证码有效期为 <strong th:text="${validMinutes}">5</strong> 分钟，请勿泄露给他人。
                        </p>
                        <p style="margin:0;color:#b2bec3;line-height:1.6;font-size:12px;">
                            如非本人操作，请忽略本邮件。
                        </p>
                    </td>
                </tr>
                <!-- 底部版权 -->
                <tr>
                    <td style="padding:20px 32px;background-color:#f1f2f6;text-align:center;">
                        <p style="margin:0;color:#b2bec3;font-size:12px;">
                            © <span th:text="${T(java.time.Year).now().getValue()}">2026</span>
                            <span th:text="${appName}">seckill-mall</span> · 本邮件由系统自动发送，请勿直接回复
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
