<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>秒杀成功</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f6fa;font-family:'Microsoft YaHei','Helvetica Neue',Arial,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f5f6fa;padding:24px 0;">
    <tr>
        <td align="center">
            <table width="600" cellpadding="0" cellspacing="0" border="0"
                   style="background-color:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.05);">
                <!-- 顶部 Logo 区 -->
                <tr>
                    <td style="background:linear-gradient(135deg,#11998e,#38ef7d);padding:24px 32px;text-align:center;">
                        <span style="font-size:22px;font-weight:bold;color:#ffffff;letter-spacing:2px;"
                              th:text="${appName} + ' · 秒杀商城'">秒杀商城</span>
                    </td>
                </tr>
                <!-- 正文 -->
                <tr>
                    <td style="padding:32px;">
                        <h2 style="margin:0 0 16px;color:#2d3436;font-size:20px;">🎉 恭喜，秒杀成功！</h2>
                        <p style="margin:0 0 16px;color:#636e72;line-height:1.6;font-size:14px;">
                            您抢购的商品已下单成功，订单详情如下：
                        </p>
                        <table width="100%" cellpadding="0" cellspacing="0" border="0"
                               style="margin:0 0 16px;border:1px solid #dfe6e9;border-radius:6px;overflow:hidden;">
                            <tr>
                                <td style="padding:12px 16px;background-color:#f1f2f6;color:#636e72;font-size:13px;width:120px;">商品名称</td>
                                <td style="padding:12px 16px;color:#2d3436;font-size:14px;" th:text="${goodsName}">商品名称</td>
                            </tr>
                            <tr>
                                <td style="padding:12px 16px;background-color:#f1f2f6;color:#636e72;font-size:13px;">订单编号</td>
                                <td style="padding:12px 16px;color:#2d3436;font-size:14px;" th:text="${orderNo}">SK20260101000000</td>
                            </tr>
                            <tr>
                                <td style="padding:12px 16px;background-color:#f1f2f6;color:#636e72;font-size:13px;">订单金额</td>
                                <td style="padding:12px 16px;color:#ff4e50;font-size:16px;font-weight:bold;">
                                    ¥ <span th:text="${totalAmount}">99.00</span>
                                </td>
                            </tr>
                        </table>
                        <div style="padding:14px 16px;background-color:#fff6e6;border-left:4px solid #ffa502;border-radius:4px;">
                            <p style="margin:0;color:#b8860b;font-size:13px;line-height:1.6;">
                                ⏰ 请在 <strong th:text="${payTimeoutMinutes}">15</strong> 分钟内完成支付，超时订单将自动取消。
                            </p>
                        </div>
                    </td>
                </tr>
                <!-- 底部版权 -->
                <tr>
                    <td style="padding:20px 32px;background-color:#f1f2f6;text-align:center;">
                        <p style="margin:0;color:#b2bec3;font-size:12px;">
                            © <span th:text="${T(java.time.Year).now().getValue()}">2026</span>
                            <span th:text="${appName}">seckill-mall</span> · 本邮件由系统自动发送，请勿直接回复
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
