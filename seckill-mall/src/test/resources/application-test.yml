# =====================================================================
# 测试环境配置：供 Testcontainers 集成测试与 @WebMvcTest/@SpringBootTest 使用
# - 邮件发送关闭（host 留空，避免连 SMTP）
# - JWT 密钥使用测试专用常量（需满足 HS256 ≥ 32 字节）
# - 数据源/RabbitMQ/Redis 由集成测试 @DynamicPropertySource 动态注入容器
# - schema.sql/data.sql 在 Testcontainers MySQL 容器上初始化
# =====================================================================
spring:
  profiles:
    active: test
  mail:
    host: ""
    port: 0
    username: ""
    password: ""
  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations: classpath:sql/schema.sql
      data-locations: classpath:sql/data.sql
  rabbitmq:
    listener:
      simple:
        acknowledge-mode: auto

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: test-secret-key-for-jwt-hs256-algorithm-2024-seckill-mall
  access-token-expiration: 7200000
  refresh-token-expiration: 604800000

seckill:
  pay-timeout-minutes: 15
  rate-limit-per-user: 1
  rate-limit-per-ip: 30
  security:
    sign-secret: test-seckill-sign-secret-2024
    replay-window-seconds: 60

logging:
  level:
    com.seckill.mall: WARN
    org.springframework: WARN
