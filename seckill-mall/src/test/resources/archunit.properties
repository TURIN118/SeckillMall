# ArchUnit 全局配置
# 参考: https://github.com/TNG/ArchUnit

# Freeze 模式配置：将现有违规记录到文本文件，阻止新增违规
# - default.path: freeze 违规文件的存储目录（相对于模块工作目录）
# - default.allowStoreCreation: 是否允许创建新的存储（首次运行需要 true）
# - default.allowStoreUpdate: 是否允许更新存储（当违规被消除时同步缩减）
freeze.store.default.path=src/test/resources/archunit-frozen-violations
freeze.store.default.allowStoreCreation=true
freeze.store.default.allowStoreUpdate=true